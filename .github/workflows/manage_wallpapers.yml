name: Manage Wallpapers
run-name: ${{ inputs.action == 'remove' && '🗑️ Remover papéis de parede' || '🖼️ Listar catálogo de papéis de parede' }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação a realizar'
        type: choice
        default: 'list_all'
        options:
          - 'list_all'
          - 'remove'
      wallpaper_ids:
        description: 'IDs dos wallpapers para remover (separados por vírgula ou espaço, ex: wallpaper_wh_3z1mge, wallpaper_wh_6d2k89 ou wh_3z1mge ou 3z1mge)'
        required: false
        default: ''
      keyword:
        description: 'Palavra-chave a buscar no título ou tags para remover (ex: car, anime, neon)'
        required: false
        default: ''
      category:
        description: 'Remover todos os papéis de parede de uma categoria inteira'
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'oled'
          - 'anime'
          - 'games'
          - 'cyberpunk'
          - 'city'
          - 'cars'
          - 'animals'
          - 'fantasy'
          - 'minimal'
          - 'abstract'
          - 'nature'
          - 'space'
      dry_run:
        description: 'Simulação (Dry Run): apenas mostra o que seria removido, sem deletar de verdade'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  manage:
    name: ${{ inputs.action == 'remove' && 'Remover Wallpapers' || 'Listar Catálogo' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute wallpaper management
        env:
          ACTION: ${{ github.event.inputs.action || 'list_all' }}
          WALLPAPER_IDS: ${{ github.event.inputs.wallpaper_ids || '' }}
          KEYWORD: ${{ github.event.inputs.keyword || '' }}
          CATEGORY: ${{ github.event.inputs.category || 'none' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$ACTION" = "remove" ]; then
            CMD_ACTION="remove"
            if [ -n "$WALLPAPER_IDS" ]; then
              ARGS="$ARGS --ids \"$WALLPAPER_IDS\""
            fi
            if [ -n "$KEYWORD" ]; then
              ARGS="$ARGS --keyword \"$KEYWORD\""
            fi
            if [ -n "$CATEGORY" ] && [ "$CATEGORY" != "none" ]; then
              ARGS="$ARGS --category \"$CATEGORY\""
            fi
            if [ "$DRY_RUN" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
          else
            CMD_ACTION="list"
          fi

          echo "Executando: python scripts/manage_wallpapers.py --action $CMD_ACTION $ARGS"
          eval python scripts/manage_wallpapers.py --action "$CMD_ACTION" $ARGS

      - name: Commit and push changes
        if: ${{ github.event.inputs.action == 'remove' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain wallpapers/ app/src/main/assets/wallpapers/)" ]; then
            git add wallpapers/ app/src/main/assets/wallpapers/
            git commit -m "chore(wallpapers): remove selected wallpapers [skip ci]"
            git push origin main
            echo "Alterações salvas e enviadas com sucesso."
          else
            echo "Nenhuma alteração de arquivo detectada para commit."
          fi
