name: Sync Wallpapers
run-name: Curate and sync wallpapers

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      category_preset:
        description: 'Categoria (ou "all" para todas as 12, ou "custom" para personalizada)'
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'oled'
          - 'anime'
          - 'games'
          - 'cyberpunk'
          - 'city'
          - 'cars'
          - 'animals'
          - 'fantasy'
          - 'minimal'
          - 'abstract'
          - 'nature'
          - 'space'
          - 'custom'
      custom_categories:
        description: 'Se escolheu "custom", digite as categorias desejadas separadas por vírgula (ex: anime,games,cars)'
        required: false
        default: ''
      max_total:
        description: 'Total máximo de wallpapers para adicionar'
        required: false
        default: '12'
      max_per_category:
        description: 'Máximo por categoria (0 para distribuir automaticamente)'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  sync:
    name: Curate Wallpapers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run wallpaper synchronization
        env:
          PRESET: ${{ github.event.inputs.category_preset || 'all' }}
          CUSTOM: ${{ github.event.inputs.custom_categories || '' }}
          MAX_TOTAL: ${{ github.event.inputs.max_total || '12' }}
          MAX_PER_CAT: ${{ github.event.inputs.max_per_category || '2' }}
        run: |
          ALL_CATS="oled,anime,games,minimal,abstract,nature,space,cyberpunk,city,cars,animals,fantasy"
          
          if [ -n "$CUSTOM" ]; then
            SELECTED_CATS="$CUSTOM"
          elif [ "$PRESET" = "all" ] || [ -z "$PRESET" ]; then
            SELECTED_CATS="$ALL_CATS"
          else
            SELECTED_CATS="$PRESET"
          fi

          echo "=========================================="
          echo "Sincronizando Wallpapers"
          echo "Preset selecionado: $PRESET"
          echo "Categorias a baixar: $SELECTED_CATS"
          echo "Total máximo: $MAX_TOTAL"
          echo "Máximo por categoria: $MAX_PER_CAT"
          echo "=========================================="

          python scripts/sync_wallpapers.py \
            --max-total "$MAX_TOTAL" \
            --max-per-category "$MAX_PER_CAT" \
            --categories "$SELECTED_CATS"

      - name: Commit and push new wallpapers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain wallpapers/ app/src/main/assets/wallpapers/)" ]; then
            git add wallpapers/ app/src/main/assets/wallpapers/
            git commit -m "chore(wallpapers): auto-sync curated wallpapers [skip ci]"
            git push origin main
            echo "Successfully pushed new curated wallpapers."
          else
            echo "No new wallpapers to commit."
          fi
