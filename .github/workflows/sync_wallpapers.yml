name: Sync Wallpapers
run-name: Curate and sync wallpapers

on:
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      max_total:
        description: 'Max total wallpapers to add (e.g. 12)'
        required: false
        default: '6'
      max_per_category:
        description: 'Max wallpapers per category (e.g. 2)'
        required: false
        default: '2'
      categories:
        description: 'Categories to sync (comma-separated: oled,anime,games,minimal,abstract,nature,space,cyberpunk,city,cars,animals,fantasy)'
        required: false
        default: 'oled,anime,games,minimal,abstract,nature,space,cyberpunk,city,cars,animals,fantasy'

permissions:
  contents: write

jobs:
  sync:
    name: Curate Wallpapers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run wallpaper synchronization
        env:
          MAX_TOTAL: ${{ github.event.inputs.max_total || '12' }}
          MAX_PER_CAT: ${{ github.event.inputs.max_per_category || '2' }}
          CATEGORIES: ${{ github.event.inputs.categories || 'oled,anime,games,minimal,abstract,nature,space,cyberpunk,city,cars,animals,fantasy' }}
        run: |
          python scripts/sync_wallpapers.py \
            --max-total "$MAX_TOTAL" \
            --max-per-category "$MAX_PER_CAT" \
            --categories "$CATEGORIES"

      - name: Commit and push new wallpapers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain wallpapers/ app/src/main/assets/wallpapers/)" ]; then
            git add wallpapers/ app/src/main/assets/wallpapers/
            git commit -m "chore(wallpapers): auto-sync curated wallpapers [skip ci]"
            git push origin main
            echo "Successfully pushed new curated wallpapers."
          else
            echo "No new wallpapers to commit."
          fi
