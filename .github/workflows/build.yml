name: Build APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Using repository secrets for signing release..."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
            cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "No signing secrets found. Generating fallback keystore for installable release build..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias release-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=ViagraLauncher, OU=Dev, O=Viagra, C=BR"
            cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=android
          keyAlias=release-key
          keyPassword=android
          EOF
          fi

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Clean up temporary keystore
        if: always()
        run: rm -f release.keystore keystore.properties

      - name: Prepare APK for upload
        run: |
          mkdir -p artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/viagra-launcher-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/viagra-launcher-release.apk
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viagra-launcher-release
          path: artifacts/viagra-launcher-release.apk
          retention-days: 30

      - name: Detect Version and Check for New Release
        id: version_check
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG_NAME="v${VERSION_NAME}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

          # Verifica se a tag já existe no repositório remoto
          if git ls-remote --tags origin "refs/tags/${TAG_NAME}" | grep -q "${TAG_NAME}"; then
            echo "Tag ${TAG_NAME} already exists in repository. Skipping version release creation."
            echo "IS_NEW_VERSION=false" >> $GITHUB_OUTPUT
          else
            echo "Tag ${TAG_NAME} does NOT exist yet. A new version release will be created!"
            echo "IS_NEW_VERSION=true" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Release Notes
        run: |
          # Extrai apenas a seção da versão mais recente de CHANGELOG_LATEST.md (até o primeiro separador '---')
          awk 'BEGIN{p=1} /^---/{p=0} p{print}' CHANGELOG_LATEST.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "### Viagra Launcher ${{ steps.version_check.outputs.TAG_NAME }}" > RELEASE_NOTES.md
            echo "Atualizações e melhorias de estabilidade." >> RELEASE_NOTES.md
          fi

          cat >> RELEASE_NOTES.md <<EOF

          ### Direct APK Download
          - [Download Release APK](https://github.com/${{ github.repository }}/releases/download/latest/viagra-launcher-release.apk)

          Built automatically from commit \`${{ github.sha }}\`.
          EOF

      - name: Create or Update Version Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.TAG_NAME }}
          name: "Viagra Launcher ${{ steps.version_check.outputs.TAG_NAME }}"
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: |
            artifacts/viagra-launcher-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release for direct download
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Viagra Launcher - Latest APKs (${{ steps.version_check.outputs.TAG_NAME }})"
          body_path: RELEASE_NOTES.md
          prerelease: false
          files: |
            artifacts/viagra-launcher-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
